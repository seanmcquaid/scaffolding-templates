name: Pull Request
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linting:
    runs-on: ubuntu-latest
    name: Linting
    steps:
      - name: Checkout latest
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-environment
      - name: Lint
        run: pnpm lint
      - name: Check setup script sync
        run: pnpm check:setup-scripts
  unit-tests-coverage:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - name: Checkout latest
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-environment
      - name: Run Unit Tests
        run: pnpm test:coverage
  type-checks:
    runs-on: ubuntu-latest
    name: Type Checks
    steps:
      - name: Checkout latest
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-environment
      - name: Check types
        run: turbo check-types --concurrency=1
        env:
          VITE_APP_ENVIRONMENT: dev
          VITE_APP_MSW_ENABLED: false
          NEXT_PUBLIC_APP_ENVIRONMENT: dev

  browser-tests:
    runs-on: ubuntu-latest
    name: Browser E2E Tests
    steps:
      - name: Checkout latest
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-environment
      - name: Install Playwright browsers and system dependencies
        run: npx --yes playwright install --with-deps
      - name: Run E2E tests
        run: pnpm playwright:run-e2e
        env:
          CI: true
          VITE_APP_ENVIRONMENT: dev
          VITE_APP_MSW_ENABLED: false
          NEXT_PUBLIC_APP_ENVIRONMENT: dev
          EXAMPLE_SECRET_KEY: ci-test-secret
  bundle-size:
    runs-on: ubuntu-latest
    name: Bundle Size
    steps:
      - name: Checkout latest
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-environment
      - name: Bundlesize Check
        run: pnpm exec turbo bundlesize --concurrency=1
        env:
          # React Router SPA/SSR and TanStack Router SPA
          VITE_APP_ENVIRONMENT: dev
          VITE_APP_MSW_ENABLED: false
          # Next.js SSR
          NEXT_PUBLIC_APP_ENVIRONMENT: dev

  typescript-library-tree-shaking:
    runs-on: ubuntu-latest
    name: TypeScript Library Tree Shaking
    steps:
      - name: Checkout latest
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-environment
      - name: Build TypeScript Library
        run: pnpm --filter typescript-library build
      - name: Check Tree Shaking
        run: pnpm --filter typescript-library check-treeshaking
