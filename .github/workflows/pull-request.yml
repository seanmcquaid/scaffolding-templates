name: Pull Request
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linting:
    runs-on: ubuntu-latest
    name: Linting
    steps:
      - name: Checkout latest
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-environment
      - name: Lint
        run: pnpm lint
  unit-tests-coverage:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - name: Checkout latest
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-environment
      - name: Run Unit Tests
        run: pnpm test:coverage
  browser-tests:
    runs-on: ubuntu-latest
    name: Browser Smoke Tests
    steps:
      - name: Checkout latest
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-environment
      - name: Install Chromium and system dependencies
        run: pnpm --filter react-router-spa exec playwright install --with-deps chromium
      - name: Run browser smoke tests through Turbo
        run: >-
          pnpm exec turbo playwright:ci-smoke
          --filter=next-ssr
          --filter=react-router-spa
          --filter=react-router-ssr
          --filter=tanstack-router-spa
          --filter=tanstack-start-ssr
          --concurrency=2
        env:
          CI: true
          VITE_APP_ENVIRONMENT: dev
          VITE_APP_MSW_ENABLED: false
          NEXT_PUBLIC_APP_ENVIRONMENT: dev
          EXAMPLE_SECRET_KEY: ci-test-secret
  bundle-size:
    runs-on: ubuntu-latest
    name: Bundle Size
    steps:
      - name: Checkout latest
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-environment
      - name: Bundlesize Check
        run: pnpm exec turbo bundlesize --concurrency=1
        env:
          # React Router SPA/SSR and TanStack Router SPA
          VITE_APP_ENVIRONMENT: dev
          VITE_APP_MSW_ENABLED: false
          # Next.js SSR
          NEXT_PUBLIC_APP_ENVIRONMENT: dev

  typescript-library-type-check:
    runs-on: ubuntu-latest
    name: TypeScript Library Type Check
    steps:
      - name: Checkout latest
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-environment
      - name: Build TypeScript Library
        run: pnpm --filter typescript-library build
      - name: Check Types
        run: pnpm --filter typescript-library check-types
  typescript-library-tree-shaking:
    runs-on: ubuntu-latest
    name: TypeScript Library Tree Shaking
    steps:
      - name: Checkout latest
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-environment
      - name: Build TypeScript Library
        run: pnpm --filter typescript-library build
      - name: Check Tree Shaking
        run: pnpm --filter typescript-library check-treeshaking
